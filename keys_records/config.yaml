  nav_delay_max: 9.0
  dwell_min: 2.0
  dwell_max: 5.0
  key_delay_min: 0.08
  key_delay_max: 0.22
  rate_cap_per_minute: 6
  long_rest_every_min: 8
  long_rest_every_max: 12
  long_rest_min: 20.0
  long_rest_max: 45.0

