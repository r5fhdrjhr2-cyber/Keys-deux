  freshness_days: 7

sessions:
  root: ./sessions

run:
  parcel_cap: 5

ceilings:
  list_price: 1800000
  hoa_monthly: 2000

robots:
  restricted_domains:
    - schneidercorp.com
  restricted_pacing_multiplier: 2.0
